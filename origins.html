  <h1>市町村マップ</h1>
  <p class="lede">柑橘（温州みかん以外の中晩柑）の<strong>主要産地（市町村）</strong>を地図上のドットで示します。ドットが大きいほど、その市町村が主要産地に挙げられている品種が多い土地です。<strong>ドットをクリック</strong>すると、その市町村でつくられる品種が一覧で出ます。市町村ごとの数量は調査にないため、品種の数値は所属県の値です。</p>

  <div class="layout">
    <div id="map"></div>
    <aside class="side" id="side">
      <h3>市町村を選んでください</h3>
      <p class="hint">地図のドットをクリックすると、その市町村が主要産地となっている品種が表示されます。ドットの大きさ＝品種数。</p>
      <div class="legend" id="legend"></div>
    </aside>
  </div>

<script>
const O = window.ORIGINS || null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n,d=0)=>(n==null||isNaN(n))?"–":Number(n).toLocaleString("ja-JP",{maximumFractionDigits:d});

function showMuni(m){
  const side=document.getElementById("side");
  let rows="";
  m.varieties.forEach(v=>{ rows+=`<div class="vrow"><span class="nm">${esc(v.short)}</span><span class="vv">${esc(m.pref)} ${fmt(v.ph,0)} t</span></div>`; });
  side.innerHTML=
    `<h3>${esc(m.name)}</h3>
     <div class="pref">${esc(m.pref)}・主要産地となっている品種 ${m.nvar} 件</div>
     <div class="vlist">${rows}</div>
     <p class="hint" style="margin-top:8px">数値は各品種の<strong>${esc(m.pref)}全体</strong>の収穫量（市町村別ではありません）。品種の比較・分布は<a href="explore.html">品種ページ</a>へ。</p>
     <p class="src">出典：${esc(O.source_stat)}（${esc(O.period)}）。座標：${esc(O.source_geo.name)}。</p>`;
}

function init(){
  document.getElementById("foot").innerHTML = O ?
    `出典：${esc(O.source_stat)}（政府統計の総合窓口 e-Stat、${esc(O.period)}）を加工。市町村の座標は <a href="${esc(O.source_geo.url)}">${esc(O.source_geo.name)}</a> を使用。${esc(O.count)} 市町村を表示。` :
    "産地データ（origins_data.js）が読み込まれていません。";
  if(!O || typeof L==="undefined"){ return; }

  const map=L.map('map',{zoomControl:true,attributionControl:false,scrollWheelZoom:true,minZoom:4,maxZoom:11}).setView([37.4,137.8],5);
  if(JAPAN_GEO){
    L.geoJSON(JAPAN_GEO,{style:{fillColor:"#F1EDE2",color:"#E0DACD",weight:1,fillOpacity:1}}).addTo(map);
  }
  const maxV=Math.max(...O.municipalities.map(m=>m.nvar));
  const rad=n=>3+Math.sqrt(n)*2.2;
  O.municipalities.forEach(m=>{
    const a=0.30+0.55*(m.nvar/maxV);
    const mk=L.circleMarker([m.lat,m.lng],{radius:rad(m.nvar),color:"#9A3412",weight:1,fillColor:"#C2410C",fillOpacity:a});
    mk.bindTooltip(`<span class="tip">${esc(m.name)}</span>（${esc(m.pref)}）／${m.nvar}品種`,{direction:"top",opacity:1});
    mk.on('click',()=>{ showMuni(m); });
    mk.addTo(map);
  });

  // 凡例（ドットの大きさ＝品種数）
  const leg=document.getElementById("legend");
  leg.innerHTML="ドットの大きさ＝品種数：" + [1,5,Math.round(maxV/2),maxV].filter((x,i,a)=>a.indexOf(x)===i)
    .map(n=>`<span><i class="dot" style="width:${(2*rad(n)).toFixed(0)}px;height:${(2*rad(n)).toFixed(0)}px"></i>${n}</span>`).join(" ");
}
init();
</script>
